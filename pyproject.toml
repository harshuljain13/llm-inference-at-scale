[project]
name = "llm-inference-at-scale"
version = "0.1.0"
description = "A practitioners handbook for LLM inference optimization"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Harshul Jain"}]

dependencies = [
    "torch>=2.0",
    "numpy>=1.24,<2.1",
    "matplotlib>=3.7",
    "aiohttp",
    "pydantic",
    "tabulate",
    "pyyaml",
    "transformers",
    "huggingface_hub",
]

[project.optional-dependencies]
serving = ["vllm>=0.6", "sglang[all]>=0.4"]
dev = ["jupyter", "ipykernel", "pytest"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*"]
