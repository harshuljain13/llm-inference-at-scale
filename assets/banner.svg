<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-width="0.5"/>
    </pattern>
    <rect width="1280" height="400" fill="url(#grid)"/>
  </g>
  
  <!-- Decorative elements - GPU/chip representation -->
  <g transform="translate(80, 120)" opacity="0.6">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="80" height="80" rx="4" fill="none" stroke="#6366f1" stroke-width="2"/>
    <rect x="10" y="10" width="60" height="60" rx="2" fill="#6366f1" opacity="0.2"/>
    <g stroke="#6366f1" stroke-width="1.5">
      <line x1="-15" y1="20" x2="0" y2="20"/>
      <line x1="-15" y1="40" x2="0" y2="40"/>
      <line x1="-15" y1="60" x2="0" y2="60"/>
      <line x1="80" y1="20" x2="95" y2="20"/>
      <line x1="80" y1="40" x2="95" y2="40"/>
      <line x1="80" y1="60" x2="95" y2="60"/>
      <line x1="20" y1="-15" x2="20" y2="0"/>
      <line x1="40" y1="-15" x2="40" y2="0"/>
      <line x1="60" y1="-15" x2="60" y2="0"/>
      <line x1="20" y1="80" x2="20" y2="95"/>
      <line x1="40" y1="80" x2="40" y2="95"/>
      <line x1="60" y1="80" x2="60" y2="95"/>
    </g>
    <!-- Grid inside chip -->
    <g fill="#6366f1" opacity="0.6">
      <rect x="15" y="15" width="10" height="10" rx="1"/>
      <rect x="30" y="15" width="10" height="10" rx="1"/>
      <rect x="45" y="15" width="10" height="10" rx="1"/>
      <rect x="15" y="30" width="10" height="10" rx="1"/>
      <rect x="30" y="30" width="10" height="10" rx="1"/>
      <rect x="45" y="30" width="10" height="10" rx="1"/>
      <rect x="15" y="45" width="10" height="10" rx="1"/>
      <rect x="30" y="45" width="10" height="10" rx="1"/>
      <rect x="45" y="45" width="10" height="10" rx="1"/>
      <rect x="60" y="15" width="10" height="10" rx="1"/>
      <rect x="60" y="30" width="10" height="10" rx="1"/>
      <rect x="60" y="45" width="10" height="10" rx="1"/>
      <rect x="15" y="60" width="10" height="10" rx="1"/>
      <rect x="30" y="60" width="10" height="10" rx="1"/>
      <rect x="45" y="60" width="10" height="10" rx="1"/>
      <rect x="60" y="60" width="10" height="10" rx="1"/>
    </g>
  </g>
  
  <!-- Data flow arrows -->
  <g transform="translate(200, 160)" opacity="0.5">
    <path d="M 0 0 L 60 0" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8,4"/>
    <polygon points="60,0 50,-6 50,6" fill="#8b5cf6"/>
  </g>
  
  <!-- Token representation -->
  <g transform="translate(280, 130)" opacity="0.6">
    <rect x="0" y="0" width="50" height="24" rx="4" fill="#6366f1" opacity="0.3" stroke="#6366f1" stroke-width="1"/>
    <text x="25" y="16" font-family="monospace" font-size="10" fill="#a5b4fc" text-anchor="middle">token</text>
    <rect x="60" y="0" width="50" height="24" rx="4" fill="#8b5cf6" opacity="0.3" stroke="#8b5cf6" stroke-width="1"/>
    <text x="85" y="16" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">token</text>
    <rect x="120" y="0" width="50" height="24" rx="4" fill="#a855f7" opacity="0.3" stroke="#a855f7" stroke-width="1"/>
    <text x="145" y="16" font-family="monospace" font-size="10" fill="#d8b4fe" text-anchor="middle">token</text>
    
    <rect x="0" y="36" width="50" height="24" rx="4" fill="#6366f1" opacity="0.2" stroke="#6366f1" stroke-width="1" stroke-dasharray="4,2"/>
    <rect x="60" y="36" width="50" height="24" rx="4" fill="#8b5cf6" opacity="0.2" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,2"/>
    <rect x="120" y="36" width="50" height="24" rx="4" fill="#a855f7" opacity="0.2" stroke="#a855f7" stroke-width="1" stroke-dasharray="4,2"/>
  </g>
  
  <!-- Right side decorative elements -->
  <g transform="translate(1050, 100)" opacity="0.4">
    <!-- Memory blocks -->
    <rect x="0" y="0" width="120" height="30" rx="3" fill="none" stroke="#6366f1" stroke-width="1.5"/>
    <text x="60" y="20" font-family="monospace" font-size="11" fill="#a5b4fc" text-anchor="middle">KV Cache</text>
    
    <rect x="0" y="45" width="120" height="30" rx="3" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="60" y="65" font-family="monospace" font-size="11" fill="#c4b5fd" text-anchor="middle">Weights</text>
    
    <rect x="0" y="90" width="120" height="30" rx="3" fill="none" stroke="#a855f7" stroke-width="1.5"/>
    <text x="60" y="110" font-family="monospace" font-size="11" fill="#d8b4fe" text-anchor="middle">Activations</text>
    
    <!-- Memory bar -->
    <rect x="0" y="140" width="120" height="12" rx="2" fill="#1e1e3f" stroke="#6366f1" stroke-width="1"/>
    <rect x="2" y="142" width="70" height="8" rx="1" fill="url(#accentGrad)"/>
    <text x="60" y="168" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">80GB HBM</text>
  </g>
  
  <!-- Main title -->
  <text x="640" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    LLM Inference at Scale
  </text>
  
  <!-- Accent line under title -->
  <rect x="440" y="195" width="400" height="3" rx="1.5" fill="url(#accentGrad)"/>
  
  <!-- Subtitle -->
  <text x="640" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#9ca3af" text-anchor="middle">
    The Practitioner's Handbook for Production LLM Serving
  </text>
  
  <!-- Bottom tags -->
  <g transform="translate(640, 290)" text-anchor="middle">
    <g transform="translate(-200, 0)">
      <rect x="-45" y="-14" width="90" height="28" rx="14" fill="#6366f1" opacity="0.2"/>
      <text x="0" y="5" font-family="monospace" font-size="12" fill="#a5b4fc">vLLM</text>
    </g>
    <g transform="translate(-80, 0)">
      <rect x="-45" y="-14" width="90" height="28" rx="14" fill="#8b5cf6" opacity="0.2"/>
      <text x="0" y="5" font-family="monospace" font-size="12" fill="#c4b5fd">SGLang</text>
    </g>
    <g transform="translate(40, 0)">
      <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#a855f7" opacity="0.2"/>
      <text x="0" y="5" font-family="monospace" font-size="12" fill="#d8b4fe">TensorRT-LLM</text>
    </g>
    <g transform="translate(160, 0)">
      <rect x="-45" y="-14" width="90" height="28" rx="14" fill="#6366f1" opacity="0.2"/>
      <text x="0" y="5" font-family="monospace" font-size="12" fill="#a5b4fc">PyTorch</text>
    </g>
  </g>
  
  <!-- Subtle corner accents -->
  <path d="M 0 50 L 0 0 L 50 0" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
  <path d="M 1280 50 L 1280 0 L 1230 0" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
  <path d="M 0 350 L 0 400 L 50 400" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
  <path d="M 1280 350 L 1280 400 L 1230 400" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
</svg>